name: Build GoloPine DSP APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find and Extract ZIP
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          echo "ZIP=$ZIP"
          unzip -o "$ZIP" -d project

      - name: Find Android Project
        run: |
          DIR=$(find project -name settings.gradle -printf '%h\n' | head -1)
          echo "PROJECT=$DIR" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd $PROJECT
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoloPine-DSP-7CH-APK
          path: "**/app-debug.apk"
